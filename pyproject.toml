[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipreading"
version = "0.1.0"
description = "Personal and open-vocabulary lip reading for people who have lost their voice"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Carlos Diaz" }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["lipreading*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
